<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holy Magic Effect</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050812;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>
<canvas id="magic"></canvas>

<script>
const canvas = document.getElementById("magic");
const ctx = canvas.getContext("2d");

let W, H, cx, cy;
let startTime = performance.now();

function resize() {
    W = canvas.width = innerWidth * devicePixelRatio;
    H = canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(devicePixelRatio, devicePixelRatio);

    W = innerWidth;
    H = innerHeight;
    cx = W / 2;
    cy = H / 2;
}

addEventListener("resize", resize);
resize();

const runes = [
    "ᚨ","ᛉ","ᚱ","ᛏ","ᚷ","ᛃ",
    "ᛒ","ᚲ","ᛞ","ᚺ","ᛗ","ᚾ"
];

function glowCircle(x, y, r, alpha) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);

    ctx.shadowBlur = 30;
    ctx.shadowColor = `rgba(190,230,255,${alpha})`;
    ctx.strokeStyle = `rgba(205,235,255,${alpha})`;
    ctx.lineWidth = 2;

    ctx.stroke();
    ctx.shadowBlur = 0;
}

function magicCircle(radius, rotation, alpha) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    // 外周
    glowCircle(0, 0, radius, alpha);

    // 二重・三重魔法陣
    glowCircle(0, 0, radius * 0.82, alpha * 0.8);
    glowCircle(0, 0, radius * 0.55, alpha * 0.65);

    // 放射線
    ctx.strokeStyle = `rgba(210,240,255,${alpha * 0.7})`;
    ctx.lineWidth = 1;

    for (let i = 0; i < 12; i++) {
        const a = i * Math.PI * 2 / 12;

        ctx.beginPath();
        ctx.moveTo(
            Math.cos(a) * radius * 0.55,
            Math.sin(a) * radius * 0.55
        );
        ctx.lineTo(
            Math.cos(a) * radius,
            Math.sin(a) * radius
        );
        ctx.stroke();
    }

    // ルーン文字
    ctx.font = `${Math.max(14, radius * 0.09)}px serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = `rgba(220,245,255,${alpha})`;
    ctx.shadowBlur = 15;
    ctx.shadowColor = "rgba(170,220,255,0.8)";

    for (let i = 0; i < runes.length; i++) {
        const a = i * Math.PI * 2 / runes.length;

        const x = Math.cos(a) * radius * 0.68;
        const y = Math.sin(a) * radius * 0.68;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(a + Math.PI / 2);
        ctx.fillText(runes[i], 0, 0);
        ctx.restore();
    }

    ctx.restore();
}

function lightning(x, y, targetX, targetY) {

    ctx.save();

    ctx.beginPath();
    ctx.moveTo(x, y);

    let px = x;
    let py = y;

    const steps = 12;

    for (let i = 1; i < steps; i++) {
        const t = i / steps;

        const tx = x + (targetX - x) * t;
        const ty = y + (targetY - y) * t;

        px = tx + (Math.random() - 0.5) * 35;
        py = ty + (Math.random() - 0.5) * 20;

        ctx.lineTo(px, py);
    }

    ctx.lineTo(targetX, targetY);

    ctx.shadowBlur = 35;
    ctx.shadowColor = "rgba(180,225,255,1)";
    ctx.strokeStyle = "rgba(190,230,255,0.8)";
    ctx.lineWidth = 3;
    ctx.stroke();

    // 中心の白い光
    ctx.shadowBlur = 15;
    ctx.strokeStyle = "rgba(255,255,255,0.95)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
}

function draw() {

    const elapsed = (performance.now() - startTime) / 1000;

    // 背景
    ctx.fillStyle = "rgba(5,8,18,0.28)";
    ctx.fillRect(0, 0, W, H);

    // 魔法発動の周期
    const phase = elapsed % 5;

    // 魔法陣の大きさ
    let radius = Math.min(W, H) * 0.25;

    if (phase < 0.7) {
        radius *= phase / 0.7;
    }

    // 魔法陣
    magicCircle(
        radius,
        elapsed * 0.25,
        0.75
    );

    magicCircle(
        radius * 0.72,
        -elapsed * 0.4,
        0.5
    );

    // 中央の淡い光
    const gradient = ctx.createRadialGradient(
        cx, cy, 0,
        cx, cy, radius * 0.7
    );

    gradient.addColorStop(0, "rgba(230,250,255,0.20)");
    gradient.addColorStop(0.35, "rgba(180,225,255,0.08)");
    gradient.addColorStop(1, "rgba(100,160,255,0)");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 0.7, 0, Math.PI * 2);
    ctx.fill();

    // 雷撃
    if (phase > 1.4 && phase < 2.5) {

        const count = 3 + Math.floor(Math.random() * 4);

        for (let i = 0; i < count; i++) {

            const x =
                cx +
                (Math.random() - 0.5) * radius * 1.8;

            lightning(
                x,
                -20,
                cx + (Math.random() - 0.5) * radius,
                cy
            );
        }
    }

    // 発動直後のフラッシュ
    if (phase > 2.4 && phase < 2.7) {

        const a =
            1 - Math.abs(phase - 2.55) / 0.15;

        ctx.fillStyle =
            `rgba(230,250,255,${a * 0.45})`;

        ctx.fillRect(0, 0, W, H);
    }

    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
