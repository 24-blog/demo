        <path transform="rotate(151.3)" d="M78 -1.22 L191.7 0 L78 1.22Z"/>
        <path transform="rotate(166.6)" d="M78 -1.96 L167.1 0 L78 1.96Z"/>
        <path transform="rotate(179.6)" d="M78 -1.79 L195.0 0 L78 1.79Z"/>
        <path transform="rotate(197.2)" d="M78 -2.47 L191.1 0 L78 2.47Z"/>
        <path transform="rotate(212.9)" d="M78 -1.73 L167.4 0 L78 1.73Z"/>
        <path transform="rotate(222.7)" d="M78 -1.65 L199.4 0 L78 1.65Z"/>
        <path transform="rotate(240.1)" d="M78 -1.76 L196.9 0 L78 1.76Z"/>
        <path transform="rotate(257.7)" d="M78 -1.85 L151.3 0 L78 1.85Z"/>
        <path transform="rotate(271.4)" d="M78 -2.30 L154.4 0 L78 2.30Z"/>
        <path transform="rotate(284.7)" d="M78 -1.94 L204.9 0 L78 1.94Z"/>
        <path transform="rotate(298.8)" d="M78 -1.50 L208.5 0 L78 1.50Z"/>
        <path transform="rotate(317.7)" d="M78 -1.45 L179.0 0 L78 1.45Z"/>
        <path transform="rotate(327.5)" d="M78 -2.35 L153.2 0 L78 2.35Z"/>
        <path transform="rotate(346.6)" d="M78 -2.51 L153.4 0 L78 2.51Z"/>
        </g>
      </g>
      <g class="o spin-b">
        <g transform="translate(180 120)" fill="url(#rayfade)">
        <path transform="rotate(8.5)" d="M78 -0.85 L133.4 0 L78 0.85Z"/>
        <path transform="rotate(11.5)" d="M78 -0.95 L103.0 0 L78 0.95Z"/>
        <path transform="rotate(22.0)" d="M78 -0.55 L147.6 0 L78 0.55Z"/>
        <path transform="rotate(26.9)" d="M78 -0.57 L111.0 0 L78 0.57Z"/>
        <path transform="rotate(37.6)" d="M78 -0.54 L130.2 0 L78 0.54Z"/>
        <path transform="rotate(42.1)" d="M78 -0.75 L147.9 0 L78 0.75Z"/>
        <path transform="rotate(53.7)" d="M78 -0.63 L142.2 0 L78 0.63Z"/>
        <path transform="rotate(58.8)" d="M78 -0.73 L139.2 0 L78 0.73Z"/>
        <path transform="rotate(66.9)" d="M78 -0.71 L138.9 0 L78 0.71Z"/>
        <path transform="rotate(73.7)" d="M78 -0.92 L159.4 0 L78 0.92Z"/>
        <path transform="rotate(81.2)" d="M78 -0.67 L150.0 0 L78 0.67Z"/>
        <path transform="rotate(86.3)" d="M78 -0.58 L111.5 0 L78 0.58Z"/>
        <path transform="rotate(98.0)" d="M78 -0.98 L107.9 0 L78 0.98Z"/>
        <path transform="rotate(103.4)" d="M78 -0.94 L116.9 0 L78 0.94Z"/>
