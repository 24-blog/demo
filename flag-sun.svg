<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">赤地に太陽</title>

  <defs>
    <clipPath id="flag"><rect width="360" height="240"/></clipPath>

    <!-- 太陽本体 -->
    <radialGradient id="body" cx="0.5" cy="0.5" r="0.5" fx="0.38" fy="0.38">
      <stop offset="0"    stop-color="#FFFF44"/>
      <stop offset="0.40" stop-color="#FFE000"/>
      <stop offset="0.75" stop-color="#FFB800"/>
      <stop offset="1"    stop-color="#FF9500"/>
    </radialGradient>

    <!-- 呼吸に合わせて中心が白熱する -->
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#FFFBC0" stop-opacity="0.25"/>
      <stop offset="1"   stop-color="#FFE000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="corona">
      <stop offset="0"    stop-color="#FFE600" stop-opacity="0.55"/>
      <stop offset="0.40" stop-color="#FFB400" stop-opacity="0.30"/>
      <stop offset="0.70" stop-color="#FF7800" stop-opacity="0.10"/>
      <stop offset="1"    stop-color="#FF7800" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="halo">
      <stop offset="0"   stop-color="#FFC800" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FF9600" stop-opacity="0.09"/>
      <stop offset="1"   stop-color="#FF9600" stop-opacity="0"/>
    </radialGradient>

    <!-- 赤地への照り返し(加算ブレンド) -->
    <radialGradient id="reflect">
      <stop offset="0"    stop-color="#FF8A00" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#FF5A00" stop-opacity="0.16"/>
      <stop offset="1"    stop-color="#FF5A00" stop-opacity="0"/>
    </radialGradient>

    <!-- 光線: 根元は明るく、先へ向かって消える -->
    <radialGradient id="rayfade" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="215">
      <stop offset="0.36" stop-color="#FFF2A0" stop-opacity="0.60"/>
      <stop offset="0.70" stop-color="#FFC840" stop-opacity="0.18"/>
      <stop offset="1"    stop-color="#FFB000" stop-opacity="0"/>
    </radialGradient>

    <filter id="raysoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <filter id="flaresoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>

    <!-- 太陽の縁をゆっくり歪ませる -->
    <filter id="wobble" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.022" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="17s" repeatCount="indefinite"
                 values="0.018 0.022;0.024 0.017;0.018 0.022"
                 calcMode="spline" keyTimes="0;0.5;1"
                 keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <style>
    /* すべての周期を互いに割り切れない値にして、繰り返しを体感させない */
    .o  { transform-origin: 180px 120px; }
    .breath   { animation: breath 11s ease-in-out infinite; }
    .heat     { animation: heat 11s ease-in-out infinite; }
    .reflect  { animation: reflect 11s ease-in-out -3s infinite; }
    .corona   { animation: corona 4.7s ease-in-out -1.2s infinite; }
    .halo     { animation: halo 7.3s ease-in-out -2.6s infinite; }
    .shimmer  { animation: shimmer 5.3s ease-in-out -0.8s infinite; }
    .spin-a   { animation: spin 140s linear infinite; }
    .spin-b   { animation: spin 190s linear infinite reverse; }
    .flare    { animation: spin 90s linear infinite, flick 3.1s ease-in-out -1s infinite; }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes breath  { 0%,100% { transform: scale(1); }     50% { transform: scale(1.022); } }
    @keyframes heat    { 0%,100% { opacity: 0; }              50% { opacity: 1; } }
    @keyframes reflect { 0%,100% { opacity: 0.55; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes corona  { 0%,100% { opacity: 0.75; transform: scale(1); }    50% { opacity: 1; transform: scale(1.08); } }
    @keyframes halo    { 0%,100% { opacity: 0.6;  transform: scale(1); }    50% { opacity: 1; transform: scale(1.12); } }
    @keyframes shimmer { 0%,100% { opacity: 0.55; } 40% { opacity: 1; } 65% { opacity: 0.7; } }
    @keyframes flick   { 0%,100% { opacity: 0.25; } 50% { opacity: 0.7; } }

    @media (prefers-reduced-motion: reduce) {
      .o { animation: none !important; }
    }
  </style>

  <g clip-path="url(#flag)">
    <!-- 赤地 -->
    <rect width="360" height="240" fill="#CC0000"/>

    <!-- 赤地への照り返し -->
    <circle class="o reflect" cx="180" cy="120" r="170" fill="url(#reflect)" style="mix-blend-mode:screen"/>

    <!-- 後光 / コロナ -->
    <circle class="o halo"   cx="180" cy="120" r="135" fill="url(#halo)"/>
    <circle class="o corona" cx="180" cy="120" r="105" fill="url(#corona)"/>

    <!-- 光線(2層・逆回転) -->
    <g class="o shimmer" filter="url(#raysoft)">
      <g class="o spin-a">
        <g transform="translate(180 120)" fill="url(#rayfade)">
        <path transform="rotate(1.3)" d="M78 -1.28 L174.1 0 L78 1.28Z"/>
        <path transform="rotate(17.0)" d="M78 -1.64 L179.3 0 L78 1.64Z"/>
        <path transform="rotate(28.1)" d="M78 -2.27 L179.2 0 L78 2.27Z"/>
        <path transform="rotate(48.0)" d="M78 -2.58 L152.4 0 L78 2.58Z"/>
