        <path transform="rotate(237.6)" d="M78 -0.78 L138.0 0 L78 0.78Z"/>
        <path transform="rotate(246.7)" d="M78 -0.68 L155.9 0 L78 0.68Z"/>
        <path transform="rotate(252.9)" d="M78 -0.91 L113.7 0 L78 0.91Z"/>
        <path transform="rotate(261.8)" d="M78 -0.75 L157.2 0 L78 0.75Z"/>
        <path transform="rotate(267.9)" d="M78 -0.54 L120.0 0 L78 0.54Z"/>
        <path transform="rotate(277.9)" d="M78 -0.96 L126.7 0 L78 0.96Z"/>
        <path transform="rotate(282.2)" d="M78 -0.72 L121.4 0 L78 0.72Z"/>
        <path transform="rotate(293.4)" d="M78 -0.62 L133.9 0 L78 0.62Z"/>
        <path transform="rotate(297.2)" d="M78 -0.76 L106.5 0 L78 0.76Z"/>
        <path transform="rotate(307.4)" d="M78 -0.94 L158.0 0 L78 0.94Z"/>
        <path transform="rotate(313.5)" d="M78 -0.89 L118.1 0 L78 0.89Z"/>
        <path transform="rotate(321.8)" d="M78 -0.79 L149.9 0 L78 0.79Z"/>
        <path transform="rotate(326.6)" d="M78 -0.60 L121.6 0 L78 0.60Z"/>
        <path transform="rotate(337.7)" d="M78 -0.84 L142.2 0 L78 0.84Z"/>
        <path transform="rotate(342.3)" d="M78 -0.57 L112.8 0 L78 0.57Z"/>
        <path transform="rotate(353.6)" d="M78 -0.91 L106.8 0 L78 0.91Z"/>
        <path transform="rotate(356.7)" d="M78 -0.76 L153.1 0 L78 0.76Z"/>
        </g>
      </g>
    </g>

    <!-- 太陽本体 -->
    <g class="o breath">
      <circle cx="180" cy="120" r="75" fill="url(#body)" filter="url(#wobble)"/>
      <circle class="o heat" cx="180" cy="120" r="75" fill="url(#heat)"/>
      <!-- 縁の微細なフレア -->
      <circle class="o flare" cx="180" cy="120" r="76" fill="none" stroke="#FFF6B0" stroke-width="2.4"
              stroke-dasharray="14 40 6 22 3 61 18 30 5 47" filter="url(#flaresoft)"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
